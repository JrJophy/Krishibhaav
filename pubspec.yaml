name: krishibhaav
description: "Kerala Rubber Price Intelligence App"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  rxdart: ^0.27.7
  go_router: ^13.2.0

  # Firebase (Spark plan)
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_messaging: ^16.4.3

  # UI / Utils
  google_fonts: ^6.1.0
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  http: ^1.1.2
  googleapis_auth: ^1.4.1
  fl_chart: ^0.69.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.1.0
  cloud_functions: ^6.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/icon_tile.png"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

